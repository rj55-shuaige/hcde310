<!doctype html>
<html lang="en">
<head><title>Books by {{ author }}</title></head>
<body>
  <h1>Books by {{ author }}</h1>
  <ul>
  {% for book in books %}
    {% if book.title %}
      <li>{{ book.title }} ({{ book.first_publish_year or "year unknown" }})</li>
    {% endif %}
  {% endfor %}
  </ul>
  <a href="/">New search</a>
</body>
</html>
