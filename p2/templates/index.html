<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Snow Compare</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main><h1>Snow Compare</h1><p>Compare ski resort weather side by side.</p>
<p class="notice">Demo resort coordinates are provisional. Replace them with verified OpenSkiData records before final submission.</p>
{% for category, message in get_flashed_messages(with_categories=true) %}<p role="status" class="message {{ category }}">{{ message }}</p>{% endfor %}
<form action="{{ url_for('compare') }}" method="post">
<label for="resort_a">First resort</label>
<select id="resort_a" name="resort_a" required>{% for resort in resorts %}<option value="{{ resort.id }}" {% if favorites and favorites[0] == resort.id %}selected{% endif %}>{{ resort.name }}</option>{% endfor %}</select>
<label for="resort_b">Second resort</label>
<select id="resort_b" name="resort_b" required>{% for resort in resorts %}<option value="{{ resort.id }}" {% if (favorites|length > 1 and favorites[1] == resort.id) or (not favorites and loop.index == 2) %}selected{% endif %}>{{ resort.name }}</option>{% endfor %}</select>
<button type="submit">Compare weather</button>
</form></main></body></html>
